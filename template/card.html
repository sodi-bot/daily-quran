<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-ExtraBold.otf"); font-weight: 800; }
  @font-face { font-family: "AmiriQuran"; src: url("../fonts/AmiriQuran.ttf"); }

  :root {
    --bg: #F4F0E6;
    --ink: #1F2A24;
    --muted: #4A544E;
    --faint: #8A918C;
    --accent: #5B9E8C;
    --accent-soft: #DDE7E1;
    --hl: #D7E6DF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; background: var(--bg); }
  body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .card {
    position: relative; width: 1080px; min-height: 1350px;
    padding: 72px 84px 60px 128px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .strip { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: var(--accent); }
  .blob { position: absolute; right: -150px; top: -190px; width: 520px; height: 520px; border-radius: 50%; background: var(--accent-soft); }

  .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .pill { background: var(--accent); color: #fff; font-weight: 600; font-size: 30px; padding: 12px 28px; border-radius: 999px; }
  .day { font-weight: 600; font-size: 28px; letter-spacing: 3px; color: var(--muted); }

  .icon { position: relative; margin-top: 44px; width: 80px; height: 80px; color: var(--accent); }
  .icon svg { width: 80px; height: 80px; }

  h1 { position: relative; margin-top: 32px; font-weight: 800; font-size: 62px; line-height: 1.1; letter-spacing: -1.5px; }

  .verse { position: relative; margin-top: 36px; padding: 26px 36px 24px; background: rgba(255,255,255,.55); border-radius: 22px; }
  .ar { font-family: "AmiriQuran", serif; direction: rtl; text-align: right; font-size: 46px; line-height: 1.95; color: var(--ink); }
  .ar .n { font-size: 34px; color: var(--accent); }
  .tr { margin-top: 12px; font-size: 27px; line-height: 1.45; font-style: italic; color: var(--muted); }
  .ref { margin-top: 14px; font-size: 24px; font-weight: 600; letter-spacing: .5px; color: var(--accent); }

  .body { position: relative; margin-top: 34px; font-size: 32px; line-height: 1.48; color: #2E3832; }
  .body b { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 62%, var(--hl) 62%); }

  .spacer { flex: 1; min-height: 36px; }

  .q { position: relative; border-left: 6px solid var(--accent); padding: 6px 0 6px 32px; font-size: 31px; font-weight: 700; line-height: 1.4; }

  .foot { position: relative; margin-top: 40px; display: flex; justify-content: space-between; gap: 40px; font-size: 22px; color: var(--faint); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="strip"></div>
  <div class="blob"></div>
  <div class="top"><span class="pill" id="tag"></span><span class="day" id="day"></span></div>
  <div class="icon" id="icon"></div>
  <h1 id="title"></h1>
  <div class="verse">
    <div class="ar" id="arabic"></div>
    <div class="tr" id="translation"></div>
    <div class="ref" id="ref"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="spacer"></div>
  <div class="q" id="question"></div>
  <div class="foot"><span id="source"></span><span id="date"></span></div>
</div>
</body>
</html>
