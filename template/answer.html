<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "Inter"; src: url("../fonts/Inter-ExtraBold.otf"); font-weight: 800; }
  @font-face { font-family: "AmiriQuran"; src: url("../fonts/AmiriQuran.ttf"); }
  @font-face { font-family: "Amiri"; src: url("../fonts/Amiri-Bold.ttf"); font-weight: 700; }

  :root {
    --bg: #F4F0E6; --ink: #1F2A24; --muted: #4A544E; --faint: #8A918C;
    --accent: #5B9E8C; --accent-soft: #DDE7E1; --accent-ink: #2F6E5E;
    --warm: #B07A3E; --warm-soft: #F1E6D6; --hl: #D7E6DF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; background: var(--bg); }
  body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .hide { display: none !important; }

  .card { position: relative; width: 1080px; min-height: 1350px; padding: 72px 84px 60px 128px; overflow: hidden; display: flex; flex-direction: column; }
  .strip { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: var(--warm); }
  .blob { position: absolute; right: -150px; top: -190px; width: 480px; height: 480px; border-radius: 50%; background: var(--warm-soft); }

  .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .pill { background: var(--warm); color: #fff; font-weight: 600; font-size: 28px; padding: 12px 28px; border-radius: 999px; }
  .day { font-weight: 600; font-size: 28px; letter-spacing: 3px; color: var(--muted); }

  .over { position: relative; margin-top: 40px; font-size: 24px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--warm); }
  .askd { position: relative; margin-top: 12px; font-size: 27px; line-height: 1.42; font-style: italic; color: var(--muted); }
  h1 { position: relative; margin-top: 22px; font-weight: 800; font-size: 56px; line-height: 1.12; letter-spacing: -1.3px; }

  .phrase { position: relative; margin-top: 28px; padding: 20px 32px 18px; background: rgba(255,255,255,.6); border-radius: 22px; display: flex; align-items: center; gap: 28px; }
  .phrase .ar { font-family: "AmiriQuran", serif; direction: rtl; font-size: 46px; line-height: 1.7; color: var(--accent-ink); white-space: nowrap; }
  .phrase .pt { flex: 1; }
  .phrase .tl { font-size: 28px; font-weight: 700; }
  .phrase .mn { margin-top: 4px; font-size: 25px; color: var(--muted); }
  .phrase .rf { margin-top: 6px; font-size: 21px; font-weight: 600; color: var(--accent); }

  .points { position: relative; margin-top: 28px; display: flex; flex-direction: column; gap: 22px; }
  .pt-item { border-left: 6px solid var(--accent-soft); padding: 2px 0 2px 28px; }
  .pt-item.own { border-left-color: var(--warm); }
  .pl { font-size: 21px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-ink); }
  .pt-item.own .pl { color: var(--warm); }
  .px { margin-top: 6px; font-size: 29px; line-height: 1.46; color: #2E3832; }
  .px b { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 62%, var(--hl) 62%); }
  .pw { margin-top: 6px; font-size: 21px; color: var(--faint); }

  .spacer { flex: 1; min-height: 30px; }
  .bottom { position: relative; background: var(--warm-soft); border-radius: 20px; padding: 22px 30px; }
  .bl { font-size: 21px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--warm); }
  .bx { margin-top: 6px; font-size: 28px; line-height: 1.42; font-weight: 600; color: #3E3428; }

  .review { position: relative; margin-top: 22px; display: flex; align-items: center; gap: 18px; font-size: 23px; color: var(--muted); }
  .review .l { font-family: "Amiri", serif; font-weight: 700; font-size: 38px; color: var(--accent-ink); direction: rtl; display: flex; gap: 12px; }
  .review b { color: var(--ink); }
  .foot { position: relative; margin-top: 26px; display: flex; justify-content: space-between; gap: 40px; font-size: 21px; color: var(--faint); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="strip"></div>
  <div class="blob"></div>
  <div class="top"><span class="pill" id="tag"></span><span class="day" id="day"></span></div>
  <div class="over" id="over"></div>
  <div class="askd" id="asked"></div>
  <h1 id="title"></h1>
  <div class="phrase">
    <div class="ar" id="phrase_ar"></div>
    <div class="pt"><div class="tl" id="phrase_tl"></div><div class="mn" id="phrase_mn"></div><div class="rf" id="phrase_rf"></div></div>
  </div>
  <div class="points" id="points"></div>
  <div class="spacer"></div>
  <div class="bottom" id="bottom"><div class="bl" id="bottom_label"></div><div class="bx" id="bottom_text"></div></div>
  <div class="review" id="review"></div>
  <div class="foot"><span id="source"></span><span id="date"></span></div>
</div>
</body>
</html>
